name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build SoundCraft EXE
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Filter "Cargo.toml" -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $content = Get-Content $_.FullName -Raw
              $content -match '\[workspace\]' -or $content -match 'name\s*=\s*"soundcraft"'
            } |
            Select-Object -First 1

          if (-not $manifest) {
            Write-Error "Could not find workspace or soundcraft Cargo.toml."
            exit 1
          }

          $projectDir = $manifest.Directory.FullName
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          Push-Location $projectDir
          try {
            cargo build --release -p soundcraft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload EXE artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soundcraft-windows-x64
          path: ${{ env.PROJECT_DIR }}/target/release/soundcraft.exe
