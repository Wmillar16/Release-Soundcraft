name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Extract ZIP and Build SoundCraft EXE
        shell: pwsh
        run: |
          $zipFile = Get-ChildItem -Filter "*.zip" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zipFile) {
            $extractRoot = Join-Path (Get-Location) "_extracted_src"
            Expand-Archive -Path $zipFile.FullName -DestinationPath $extractRoot -Force
          }

          $manifest = Get-ChildItem -Filter "Cargo.toml" -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $content = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
              $content -match '\[workspace\]' -or $content -match 'name\s*=\s*"soundcraft"'
            } |
            Select-Object -First 1

          if (-not $manifest) {
            Write-Error "Could not find Cargo.toml in the repo or inside any .zip file."
            exit 1
          }

          $projectDir = $manifest.Directory.FullName
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          cargo build --release -p soundcraft --manifest-path "$projectDir/Cargo.toml"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload EXE artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soundcraft-windows-x64
          path: ${{ env.PROJECT_DIR }}/target/release/soundcraft.exe
