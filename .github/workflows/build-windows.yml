- name: Build SoundCraft EXE
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Filter "*.zip" -Recurse -ErrorAction SilentlyContinue
          foreach ($z in $zips) {
            $extractDir = Join-Path (Get-Location) ("_unzip_" + [System.IO.Path]::GetFileNameWithoutExtension($z.Name))
            Expand-Archive -Path $z.FullName -DestinationPath $extractDir -Force
          }

          $manifest = Get-ChildItem -Filter "Cargo.toml" -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $content = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
              $content -match '\[workspace\]' -or $content -match 'name\s*=\s*"soundcraft"'
            } |
            Select-Object -First 1

          if (-not $manifest) {
            Write-Host "Files in workspace root:"
            Get-ChildItem -Force | Format-Table Name, Mode -AutoSize
            Write-Error "Could not find workspace or soundcraft Cargo.toml. Make sure your extracted SoundCraft source files (not only a .zip) are committed to the repository."
            exit 1
          }

          $projectDir = $manifest.Directory.FullName
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          Push-Location $projectDir
          try {
            cargo build --release -p soundcraft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
