- name: Extract SoundCraft source
        shell: pwsh
        run: |
          Expand-Archive -Path ".github/assets/soundcraft-main-clean-v6.zip" -DestinationPath "$env:RUNNER_TEMP\src" -Force
          $root = Get-ChildItem "$env:RUNNER_TEMP\src" | Select-Object -First 1
          Set-Location $root.FullName
          "WORKSPACE_DIR=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build SoundCraft (Release)
        shell: pwsh
        run: |
          cd "$env:WORKSPACE_DIR"
          cargo build --release -p soundcraft

      - name: Upload SoundCraft Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: soundcraft-windows-x64
          path: ${{ env.WORKSPACE_DIR }}/target/release/soundcraft.exe
