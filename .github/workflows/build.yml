name: Build SoundCraft

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows soundcraft.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --package soundcraft --target x86_64-pc-windows-msvc

      - name: Upload soundcraft.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundcraft-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/soundcraft.exe
